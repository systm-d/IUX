name: iux_flutter
description: Human-centred foundations and UX patterns for Flutter applications.
# The one place a version number is decided. `CHANGELOG.md` at the repository
# root repeats it in its top heading, and `CHANGELOG.md` beside this file names
# it once. `dart pub publish --dry-run` warns when the second of those drifts,
# which is how the previous three-way disagreement — this file at 0.1.0-dev.9,
# the package changelog at 0.1.0-dev.1, the repository changelog at
# 0.1.0-dev.11 — was visible for three missions before anyone reconciled it.
# See CONTRIBUTING.md, "Versioning".
version: 0.2.0-dev.6

repository: https://github.com/systm-d/IUX
issue_tracker: https://github.com/systm-d/IUX/issues

# Still not published. The licence question is settled — MIT, at the repository
# root and beside this file — and `dart pub publish --dry-run` is clean. But
# publishing is a separate decision from being publishable, and several entries
# in docs/evidence/semantic-tokens-and-accessibility.md are still open,
# including the one no code closes: nothing here has ever been validated on a
# real device with a screen reader.
publish_to: none

environment:
  # The two bounds answer different questions, and they are set from
  # measurement rather than habit.
  #
  # `sdk` is the *language* version the sources are written against. Nothing
  # here uses a feature newer than Dart 3.0: `flutter analyze` is clean with
  # this bound, and the analyzer enforces language-version gating from it, so
  # a post-3.0 feature would be an error rather than an opinion. It is left at
  # 3.0 deliberately. Raising it to 3.8 to match the Flutter bound below would
  # switch `dart format` to its 3.7 "tall" style and rewrite 157 of the 172
  # files in this package with no behavioural content — measured, and a
  # decision for whoever wants that diff, not a side effect of this line.
  #
  # `flutter` is the *library* version the package needs, and this is the bound
  # that actually protects a consumer: pub enforces it, and Flutter 3.35.0
  # itself requires Dart ^3.8.0-0, so no resolution can land on an SDK where
  # this fails to compile. 3.35.0 is where the newest Flutter API used by
  # `lib/` — `MediaQuery.supportsAnnounceOf` — first appears in a stable tag,
  # and all 202 Flutter types referenced by `lib/` exist at that tag. The
  # previous pubspec declared no Flutter bound at all.
  #
  # Only Flutter 3.44.8 / Dart 3.12.2 has actually run the test suite. 3.35.0
  # is a lower bound established from the API history, not a version anyone
  # has built against.
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.35.0'

# Two dependencies, both from the SDK, and the package uses nothing else: a
# sweep of every `package:` import across lib/ and test/ finds only `flutter`,
# `flutter_test` and `iux_flutter` itself. `@internal` and `@immutable` come
# from `flutter/foundation.dart`, so `package:meta` is not an undeclared
# dependency.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # This package draws Material glyphs (Icons.check and Icons.remove are the
  # selection controls' marks, and IuxIcon takes arbitrary IconData), so it
  # declares the font itself. Flutter aggregates this flag across an app and
  # its dependencies, which is what stops every consumer from having to know.
  #
  # Its absence is silent and total: no exception, no warning, every glyph
  # simply blank — a radio that changes state with an invisible mark reads as
  # a radio that does not work.
  uses-material-design: true